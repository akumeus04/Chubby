<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal</title>
  <style>
    /* Ultra-minimalist dark mode for discretion */
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: 'Courier New', Courier, monospace; 
      background: #09090b; 
      color: #71717a; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }
    input, button {
      font-family: inherit;
      background: #121216;
      border: 1px solid #27272a;
      color: #a1a1aa;
      padding: 10px;
      outline: none;
    }
    button { cursor: pointer; }
    button:active { background: #27272a; }

    /* Login Screen */
    #login-view {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 10px;
    }
    #login-view input { width: 250px; }
    #login-error { color: #ef4444; font-size: 12px; height: 14px; }

    /* Chat Screen */
    #chat-view {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    #chat-header {
      padding: 10px;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      font-size: 13px;
      word-wrap: break-word;
    }
    .msg-sender { color: #f43f5e; font-weight: bold; margin-right: 5px; }
    .msg-time { color: #52525b; font-size: 10px; margin-left: 5px; }
    
    #input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #27272a;
    }
    #msg-input { flex: 1; border-right: none; }
    #send-btn { border-left: none; font-weight: bold; }
  </style>
</head>
<body>

  <!-- LOGIN VIEW -->
  <div id="login-view">
    <div style="font-size:12px; margin-bottom:10px;">AUTH REQUIRED</div>
    <input type="email" id="email" placeholder="user@domain.com" autocomplete="off">
    <input type="password" id="password" placeholder="••••••••" autocomplete="off">
    <button id="login-btn" style="width: 250px;">ENTER</button>
    <div id="login-error"></div>
  </div>

  <!-- CHAT VIEW -->
  <div id="chat-view">
    <div id="chat-header">
      <span id="auth-user">...</span>
      <button id="logout-btn" style="padding:4px 8px; font-size:10px;">EXIT</button>
    </div>
    
    <div id="messages"></div>

    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Type..." autocomplete="off">
      <button id="send-btn">></button>
    </div>
  </div>

  <!-- FIREBASE MODULES -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // INSERT YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "ourmessenger-76636.firebaseapp.com",
      projectId: "ourmessenger-76636",
      storageBucket: "ourmessenger-76636.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elements
    const loginView = document.getElementById('login-view');
    const chatView = document.getElementById('chat-view');
    const loginError = document.getElementById('login-error');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    
    let unsubscribe = null;
    let currentUser = null;

    // LOGIN
    document.getElementById('login-btn').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if(!email || !pass) return;
      
      signInWithEmailAndPassword(auth, email, pass).catch(err => {
        loginError.innerText = "ERR: " + err.code;
      });
    });

    // LOGOUT
    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth);
    });

    // SEND MESSAGE
    const sendMessage = async () => {
      const text = msgInput.value.trim();
      if (!text || !currentUser) return;
      
      msgInput.value = ''; // clear immediately
      
      try {
        await addDoc(collection(db, "messages"), {
          senderId: currentUser.uid,
          senderName: currentUser.displayName || currentUser.email.split('@')[0],
          text: text,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("Send failed:", err);
      }
    };

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // LOAD MESSAGES
    function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("timestamp", "desc"), limit(30));
      
      unsubscribe = onSnapshot(q, (snapshot) => {
        const msgs = [];
        snapshot.forEach((doc) => msgs.push(doc.data()));
        msgs.reverse(); // oldest at top, newest at bottom

        messagesDiv.innerHTML = '';
        msgs.forEach(msg => {
          // Ignore purely media messages for this ultra-simple view
          if(!msg.text) return; 

          const time = msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
          
          const div = document.createElement('div');
          div.className = 'msg';
          div.innerHTML = `
            <span class="msg-sender">${msg.senderName || 'Unknown'}</span>
            <span class="msg-text">${msg.text}</span>
            <span class="msg-time">[${time}]</span>
          `;
          messagesDiv.appendChild(div);
        });
        
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    // AUTH STATE LISTENER
    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-user').innerText = user.email;
        loginView.style.display = 'none';
        chatView.style.display = 'flex';
        document.getElementById('password').value = ''; // clear pass
        loadMessages();
      } else {
        currentUser = null;
        loginView.style.display = 'flex';
        chatView.style.display = 'none';
        if (unsubscribe) unsubscribe();
        messagesDiv.innerHTML = '';
      }
    });
  </script>
</body>
</html>
